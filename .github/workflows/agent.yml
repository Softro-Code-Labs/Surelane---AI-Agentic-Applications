name: agent

# Sri Lanka is UTC+05:30 all year. GitHub's own timer can run late or drop runs,
# so each slot has three chances, and the database lets only the first one search.
on:
  schedule:
    - cron: '32 2 * * *'   # 08:02 Colombo
    - cron: '50 2 * * *'   # 08:20
    - cron: '10 3 * * *'   # 08:40
    - cron: '2 7 * * *'    # 12:32
    - cron: '20 7 * * *'   # 12:50
    - cron: '40 7 * * *'   # 13:10
    - cron: '32 11 * * *'  # 17:02
    - cron: '50 11 * * *'  # 17:20
    - cron: '10 12 * * *'  # 17:40
    - cron: '30 21 * * *'  # 03:00 daily cleanup
  workflow_dispatch:

concurrency:
  group: agent
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_CA_CERT: ${{ secrets.DATABASE_CA_CERT }}
      APP_SECRET: ${{ secrets.APP_SECRET }}
      APP_URL: ${{ vars.APP_URL }}
      SMTP_HOST: ${{ vars.SMTP_HOST }}
      SMTP_PORT: ${{ vars.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      SMTP_FROM: ${{ vars.SMTP_FROM }}
      AI_PROVIDER: ${{ vars.AI_PROVIDER }}
      OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL || 'gemma3:1b' }}
      AI_MAX_JOBS_PER_RUN: ${{ vars.AI_MAX_JOBS_PER_RUN }}
      AI_TIME_BUDGET_SECONDS: ${{ vars.AI_TIME_BUDGET_SECONDS }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
      HIMALAYAS_API_KEY: ${{ secrets.HIMALAYAS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - run: npm run db:migrate

      # Stops here on an idle trigger, so spare triggers cost about a minute.
      - id: work
        run: npm run worker:check

      - name: Restore local AI model
        if: steps.work.outputs.search == 'true' && env.AI_PROVIDER == 'ollama'
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-${{ env.OLLAMA_MODEL }}

      # If this fails the search still runs, using the built-in engine.
      - name: Start local AI model
        if: steps.work.outputs.search == 'true' && env.AI_PROVIDER == 'ollama'
        continue-on-error: true
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          sudo systemctl stop ollama || true
          OLLAMA_MODELS="$HOME/.ollama/models" nohup ollama serve > /dev/null 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:11434/api/tags > /dev/null && break; sleep 1; done
          OLLAMA_MODELS="$HOME/.ollama/models" ollama pull "$OLLAMA_MODEL"

      - name: Run the agent
        if: steps.work.outputs.due == 'true'
        run: npm run worker
